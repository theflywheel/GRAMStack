name: Verify Railway infrastructure

on:
  push:
    branches: [main]
    paths: ["infra/railway/**", ".github/workflows/infra-check.yml", "docs/Dockerfile"]
  pull_request:
    paths: ["infra/railway/**", ".github/workflows/infra-check.yml", "docs/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/railway/package-lock.json
      - run: npm ci
      - run: npm run check
