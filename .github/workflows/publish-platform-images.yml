name: Publish platform images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version (major.minor.patch)
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-platform-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'theflywheel/GRAMStack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gramstack-gateway
            dockerfile: services/gateway/Dockerfile
          - image: gramstack-lokos-adapter
            dockerfile: adapters/lokos/Dockerfile
          - image: gramstack-mock-lokos
            dockerfile: mocks/lokos/Dockerfile
    steps:
      - name: Validate image version
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: '[[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/flywheelai/${{ matrix.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/theflywheel/GRAMStack
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
