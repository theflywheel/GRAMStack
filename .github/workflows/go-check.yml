name: Verify Go services and SDK
on:
  push:
    branches: [main]
    paths: ["services/**", "sdk/**", "adapters/**", "mocks/**", "tools/esignet-demo/**", "tools/devcerts/**", "scripts/check-go.sh", "scripts/gateway-module.sh", "scripts/test-check-go.sh", "scripts/test-dedi.sh", "scripts/test-postgres.sh", "scripts/test-hydra.sh", "go.work", "go.work.sum", "specs/**", ".github/workflows/go-check.yml"]
  pull_request:
    paths: ["services/**", "sdk/**", "adapters/**", "mocks/**", "tools/esignet-demo/**", "tools/devcerts/**", "scripts/check-go.sh", "scripts/gateway-module.sh", "scripts/test-check-go.sh", "scripts/test-dedi.sh", "scripts/test-postgres.sh", "scripts/test-hydra.sh", "go.work", "go.work.sum", "specs/**", ".github/workflows/go-check.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            services/gateway/go.*
            sdk/go/adapter/go.*
            adapters/lokos/go.*
            adapters/auth/oidc/go.*
            mocks/identity/go.*
            mocks/lokos/go.*
      - run: ./scripts/test-check-go.sh
      - run: ./scripts/check-go.sh

  dedi-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramstack
      - uses: actions/checkout@v4
        with:
          repository: theflywheel/DeDi-node
          ref: dbdb9f6ce8f69b8253f405f9c14ea345cd9e6d1f
          path: dedi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            gramstack/services/gateway/go.*
            gramstack/adapters/auth/oidc/go.*
            dedi/go.*
      - name: Test actual DeDi publication and proof verification
        working-directory: gramstack
        run: |
          export DEDI_SOURCE="$GITHUB_WORKSPACE/dedi"
          export PG_BIN="$(pg_config --bindir)"
          ./scripts/test-dedi.sh

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            services/gateway/go.*
            adapters/auth/oidc/go.*
      - name: Test PostgreSQL consent, enforcement races and migrations
        run: |
          export PG_BIN="$(pg_config --bindir)"
          ./scripts/test-postgres.sh

  hydra-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            services/gateway/go.*
            sdk/go/adapter/go.*
            adapters/lokos/go.*
            adapters/auth/oidc/go.*
            mocks/identity/go.*
            mocks/lokos/go.*
      - name: Fetch pinned official Hydra release
        run: |
          mkdir -p "$RUNNER_TEMP/hydra"
          curl -fsSL https://github.com/ory/hydra/releases/download/v26.2.0/hydra_26.2.0-linux_64bit.tar.gz -o "$RUNNER_TEMP/hydra/release.tar.gz"
          echo '88f5112cfa594968592eb4bbba9a0b0274790f4fec909ee5874ae080506cf890  '"$RUNNER_TEMP/hydra/release.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hydra/release.tar.gz" -C "$RUNNER_TEMP/hydra" hydra
      - name: Test actual Hydra and configured gateway
        run: |
          export HYDRA_BIN="$RUNNER_TEMP/hydra/hydra"
          export PG_BIN="$(pg_config --bindir)"
          GRAMSTACK_TEST_AUTHZ=1 ./scripts/test-hydra.sh
