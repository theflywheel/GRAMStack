name: Verify Go services and SDK
on:
  push:
    branches: [main]
    paths: ["services/**", "sdk/**", "adapters/**", "mocks/**", "scripts/check-go.sh", "scripts/test-dedi.sh", "go.work", "specs/**", ".github/workflows/go-check.yml"]
  pull_request:
    paths: ["services/**", "sdk/**", "adapters/**", "mocks/**", "scripts/check-go.sh", "scripts/test-dedi.sh", "go.work", "specs/**", ".github/workflows/go-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: services/gateway/go.sum
      - run: ./scripts/check-go.sh

  dedi-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramstack
      - uses: actions/checkout@v4
        with:
          repository: theflywheel/DeDi-node
          ref: dbdb9f6ce8f69b8253f405f9c14ea345cd9e6d1f
          path: dedi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            gramstack/services/gateway/go.sum
            dedi/go.sum
      - name: Test actual DeDi publication and proof verification
        working-directory: gramstack
        run: |
          export DEDI_SOURCE="$GITHUB_WORKSPACE/dedi"
          export PG_BIN="$(pg_config --bindir)"
          ./scripts/test-dedi.sh
