name: Verify application SDKs
on:
  push:
    branches: [main]
    paths: ["sdk/**", "scripts/test-client-sdks.sh", ".github/workflows/client-sdk-check.yml"]
  pull_request:
    paths: ["sdk/**", "scripts/test-client-sdks.sh", ".github/workflows/client-sdk-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache-dependency-path: sdk/go/client/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - run: python -m pip install -e ./sdk/python pytest build
      - run: npm ci --ignore-scripts --prefix sdk/javascript
      - run: npm run typecheck --prefix sdk/javascript
      - run: SDK_PYTHON=python ./scripts/test-client-sdks.sh
      - run: python -m build sdk/python --outdir "$RUNNER_TEMP/sdk-packages"
      - run: npm pack --dry-run
        working-directory: sdk/javascript
