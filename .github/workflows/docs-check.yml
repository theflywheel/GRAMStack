name: Verify design site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "specs/**"
      - "tools/api-reference/**"
      - ".dockerignore"
      - ".railwayignore"
      - ".github/workflows/docs-check.yml"
      - "services/gateway/**/http.go"
      - "services/gateway/internal/authn/service.go"
      - "services/gateway/internal/consentportal/portal.go"
      - "services/gateway/internal/rights/operator.go"
      - "services/gateway/cmd/gramstack/*.go"
      - "adapters/lokos/cmd/lokos-adapter/*.go"
      - "apps/sakhicredit/internal/application/http.go"
  pull_request:
    paths:
      - "docs/**"
      - "specs/**"
      - "tools/api-reference/**"
      - ".dockerignore"
      - ".railwayignore"
      - ".github/workflows/docs-check.yml"
      - "services/gateway/**/http.go"
      - "services/gateway/internal/authn/service.go"
      - "services/gateway/internal/consentportal/portal.go"
      - "services/gateway/internal/rights/operator.go"
      - "services/gateway/cmd/gramstack/*.go"
      - "adapters/lokos/cmd/lokos-adapter/*.go"
      - "apps/sakhicredit/internal/application/http.go"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: node ../tools/api-reference/verify-routes.mjs
      - run: npm run build
      - run: npm run verify:content
      - run: npm run verify:server
