worker_processes 1;
events { worker_connections 1024; }

http {
  # OAuth query strings and flow data do not belong in ingress access logs.
  access_log off;
  error_log /dev/stderr crit;
  upstream identity {
    server esignet.railway.internal:8080;
  }

  server {
    listen 3000;
    listen [::]:3000;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    add_header Referrer-Policy no-referrer always;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 128k;

    location = /healthz {
      proxy_pass http://identity/health;
    }

    # The unmodified UI calls these three paths under the eSignet API prefix.
    location ~ ^/v1/esignet/(flow/(execute|meta)|oauth2/auth/callback)$ {
      rewrite ^/v1/esignet/(.*)$ /$1 break;
      proxy_pass http://identity;
    }

    location ~ ^/oauth2/(authorize|token|userinfo|jwks)$ {
      proxy_pass http://identity;
    }

    location ~ ^/\.well-known/(openid-configuration|oauth-authorization-server)$ {
      proxy_pass http://identity;
    }

    location = /.well-known/jwks.json {
      proxy_pass http://identity/oauth2/jwks;
    }

    # Return an actual 404 for unapproved API paths before the UI fallback.
    location ~ ^/(v1|client-mgmt|admin|actuator|flow|oauth2|oidc|\.well-known)(/|$) {
      return 404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
