# Local verification of the Railway images. Use a freshly generated project.
services:
  database:
    image: gramstack-platform-db:deployment-check
    build:
      context: ../..
      dockerfile: infra/railway/database/Dockerfile
    environment:
      GRAMSTACK_DB_CORE_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD:?Generate a fresh demo environment}
      GRAMSTACK_DB_ADAPTER_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
      GRAMSTACK_DB_PRODUCT_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
      GRAMSTACK_DB_HYDRA_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
      GRAMSTACK_DB_DEDI_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
      GRAMSTACK_DB_ESIGNET_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
      GRAMSTACK_DB_ESIGNET_MOCK_PASSWORD: ${ESIGNET_DEMO_DB_PASSWORD}
    # Replace the base Compose bind-mounted initialization SQL with the image copy.
    configs: !reset []
  mock-identity-system:
    image: gramstack-esignet-mock:deployment-check
    build:
      context: ../..
      dockerfile: infra/railway/esignet-mock/Dockerfile
    environment:
      SPRING_DATASOURCE_USERNAME: esignet_mock
  esignet:
    image: gramstack-esignet:deployment-check
    build:
      context: ../..
      dockerfile: infra/railway/esignet/Dockerfile
    environment:
      DATABASE_USERNAME: esignet
      REDIS_URL: redis://:${ESIGNET_DEMO_REDIS_PASSWORD:?Generate a fresh demo environment}@redis:6379/0
    networks:
      default:
        aliases: [esignet.railway.internal]
    configs: !reset []
  esignet-ui:
    user: "1001:1001"
    image: gramstack-esignet-ingress:deployment-check
    build:
      context: ../..
      dockerfile: infra/railway/esignet-ui/Dockerfile
    configs: !reset []
  redis:
    image: gramstack-esignet-redis:deployment-check
    build:
      context: ../..
      dockerfile: infra/railway/esignet-redis/Dockerfile
    command: !reset []
    environment:
      REDIS_PASSWORD: ${ESIGNET_DEMO_REDIS_PASSWORD:?Generate a fresh demo environment}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
