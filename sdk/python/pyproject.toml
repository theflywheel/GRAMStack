[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gramstack-client"
version = "0.1.0"
description = "First-party GRAMStack authentication, consent and retrieval SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyJWT[crypto]>=2.15.1,<3"]

[project.urls]
Repository = "https://github.com/theflywheel/GRAMStack"
Documentation = "https://docs.gramstack.try-dough.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gramstack = ["py.typed"]
